<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F5F5F7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#17171F" />
    <meta name="description" content="Vyllo — organiza e acompanha a tua coleção de livros, jogos e filmes/séries." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Vyllo" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <title>Vyllo</title>
    <script>
      (function() {
        var pref = localStorage.getItem('theme') || 'system';
        var resolved = pref === 'system'
          ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : pref;
        document.documentElement.dataset.theme = resolved;
      })();
    </script>
  </head>
  <body>
    <!--
      Splash animado em HTML. O TWA Android mostra primeiro um splash NATIVO
      estático (um PNG, não animável — limitação da tecnologia). Este assume a
      seguir, com o mesmo fundo #0E0E14, dando o pulse "respiração" que o iOS faz
      em Swift. É inline para pintar antes do bundle carregar; o main.jsx remove-o
      quando o React monta.
    -->
    <div id="boot-splash" aria-hidden="true">
      <img src="/web-app-manifest-192x192.png" alt="" width="96" height="96" />
    </div>
    <style>
      #boot-splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; align-items: center; justify-content: center;
        background: #0E0E14;
        transition: opacity .35s ease;
      }
      #boot-splash img {
        width: 96px; height: 96px;
        border-radius: 21px;                 /* 96 * ~0.22, igual à proporção do iOS */
        border: .7px solid rgba(255,255,255,.14);
        animation: bootPulse 1s ease-in-out infinite alternate;
      }
      @keyframes bootPulse {
        from { transform: scale(1); }
        to   { transform: scale(1.10); }     /* mesma amplitude do startLoadingPulse iOS */
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash img { animation: none; }
      }
    </style>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
